query TradesFeed($search: String, $ticker: String, $chamber: Chamber, $limit: Int, $offset: Int) {
  trades(search: $search, ticker: $ticker, chamber: $chamber, limit: $limit, offset: $offset) {
    totalCount
    results {
      id
      ticker
      assetNameRaw
      transactionType
      disclosureDate
      amountMin
      amountMax
      politician {
        id
        fullName
      }
    }
  }
}
